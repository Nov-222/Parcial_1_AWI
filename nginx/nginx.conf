events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Definimos los servicios upstream usando los nombres de los contenedores en Docker
    upstream django_service {
        server lacarta_django:8000;
    }

    upstream flask_service {
        server lacarta_flask:5000;
    }

    # Certificado común para localhost y los dos dominios.
    # En EC2 reemplaza estos archivos por los de Let's Encrypt.
    ssl_certificate     /etc/nginx/certs/lacarta.crt;
    ssl_certificate_key /etc/nginx/certs/lacarta.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HTTP: redirige todo a HTTPS.
    # El bloque ACME queda disponible por si luego usas certbot --webroot.
    server {
        listen 80 default_server;
        server_name _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS: Flask + admin de Django (localhost y carta.serverf.com)
    server {
        listen 443 ssl;
        server_name carta.serverf.com localhost 127.0.0.1;

        # 1. La API JSON sigue igual: /api/ -> Flask
        location /api/ {
            proxy_pass http://flask_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Páginas Jinja de La Carta -> Flask (auth, pedidos, cocina, carta)
        location ~ ^/(auth|pedidos|cocina|restaurantes|assets)(/|$) {
            proxy_pass http://flask_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Inicio y healthcheck -> Flask
        location = / {
            proxy_pass http://flask_service;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health {
            proxy_pass http://flask_service;
            proxy_set_header Host $host;
        }

        # 4. Estáticos del admin de Django servidos desde disco (collectstatic)
        location ^~ /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public";
            access_log off;
        }

        # 5. Admin de Django -> Django (también en localhost y en el dominio principal)
        location /admin/ {
            proxy_pass http://django_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /admin {
            return 301 /admin/;
        }
    }

    # HTTPS: Django (carta.serverd.com)
    server {
        listen 443 ssl;
        server_name carta.serverd.com;

        # Estáticos del admin de Django servidos desde disco (collectstatic)
        location ^~ /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public";
            access_log off;
        }

        location /admin/ {
            proxy_pass http://django_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://django_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
