events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Definimos los servicios upstream usando los nombres de los contenedores en Docker
    upstream django_service {
        server lacarta_django:8000;
    }

    upstream flask_service {
        server lacarta_flask:5000;
    }

    server {
        listen 80;
        server_name _;

        # 1. La API JSON sigue igual: /api/ -> Flask
        location /api/ {
            proxy_pass http://flask_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Páginas Jinja de La Carta -> Flask (auth, pedidos, cocina, carta)
        location ~ ^/(auth|pedidos|cocina|restaurantes|assets)(/|$) {
            proxy_pass http://flask_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2b. Estáticos del admin de Django servidos desde disco (collectstatic)
        location ^~ /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public";
            access_log off;
        }

        # 3. Inicio y healthcheck -> Flask
        location = / {
            proxy_pass http://flask_service;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health {
            proxy_pass http://flask_service;
            proxy_set_header Host $host;
        }

        # 4. Admin de Django -> Django (se mantiene como estaba)
        location /admin/ {
            proxy_pass http://django_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. Cualquier otra ruta -> Django (compatibilidad con el despliegue actual)
        location / {
            proxy_pass http://django_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
