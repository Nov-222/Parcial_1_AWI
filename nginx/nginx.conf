events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Definimos los servicios upstream usando los nombres de los contenedores en Docker
    upstream django_service {
        server lacarta_django:8000;
    }

    upstream flask_service {
        server lacarta_flask:5000;
    }

    server {
        listen 80;
        server_name localhost;

        # 1. Redirigir las peticiones de la API hacia Flask
        location /api/ {
            proxy_pass http://flask_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Redirigir el resto del tráfico (Django, Admin, vistas estáticas) hacia Django
        location / {
            proxy_pass http://django_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}